<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Portal — NJ Design Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
  <link rel="stylesheet" href="/src/admin.css" />
</head>
<body class="admin-body">

  <div id="login-screen" class="admin-screen active">
    <div class="glass-card login-card">
      <h2 class="section-title">Admin Login</h2>
      <p class="section-subtitle">Please enter your password to manage content.</p>
      <div class="form-group">
        <input type="password" id="admin-password" placeholder="Password" />
      </div>
      <button id="login-btn" class="btn btn-primary btn-full">Login</button>
      <div id="login-error" class="form-error"></div>
      <div style="margin-top: 20px; text-align: center;">
        <a href="/" class="nav-link">← Back to Site</a>
      </div>
    </div>
  </div>

  <div id="dashboard-screen" class="admin-screen">
    <nav class="admin-nav">
      <div class="nav-logo">
        <span class="logo-mark">NJ</span>
        <span class="logo-text">Admin Portal</span>
      </div>
      <div class="admin-nav-actions">
        <a href="/" class="btn btn-ghost btn-sm" target="_blank">View Site</a>
        <button id="logout-btn" class="btn btn-ghost btn-sm">Logout</button>
      </div>
    </nav>

    <div class="admin-container">
      <aside class="admin-sidebar">
        <button class="admin-tab active" data-tab="portfolio">Portfolio</button>
        <button class="admin-tab" data-tab="team">Team</button>
        <button class="admin-tab messages-tab" data-tab="messages">
          Messages
          <span id="unread-badge" class="unread-badge" style="display:none;">0</span>
        </button>
      </aside>
      
      <main class="admin-content">
        <div id="tab-portfolio" class="admin-panel active">
          <div class="panel-header" style="display: flex; justify-content: space-between; align-items: center;">
            <h3>Portfolio Projects</h3>
            <button id="add-portfolio-btn" class="btn btn-primary btn-sm">+ Add New</button>
          </div>
          <div id="admin-portfolio-list" class="admin-list"></div>
        </div>

        <div id="tab-team" class="admin-panel">
          <div class="panel-header" style="display: flex; justify-content: space-between; align-items: center;">
            <h3>Team Members</h3>
            <button id="add-team-btn" class="btn btn-primary btn-sm">+ Add New</button>
          </div>
          <div id="admin-team-list" class="admin-list"></div>
        </div>

        <div id="tab-messages" class="admin-panel">
          <div class="panel-header" style="display: flex; justify-content: space-between; align-items: center;">
            <h3>Client Messages</h3>
            <button id="clear-all-messages" class="btn btn-danger btn-sm">Clear All</button>
          </div>
          <div id="admin-messages-list" class="admin-list messages-list"></div>
        </div>

      </main>
    </div>
  </div>

  <!-- Edit Modal -->
  <div class="modal-overlay" id="admin-modal-overlay">
    <div class="modal glass-card admin-modal">
      <button class="modal-close" id="admin-modal-close" aria-label="Close modal">×</button>
      <h3 id="admin-modal-title">Edit Item</h3>
      <div id="admin-modal-form" class="admin-form">
        <!-- Form fields injected via JS -->
      </div>
      <div class="admin-modal-actions">
        <button id="admin-modal-save" class="btn btn-primary">Save Changes</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/admin.js"></script>
</body>
</html>
